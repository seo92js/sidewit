name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cmp LICENSE backend/LICENSE && cmp LICENSE frontend/LICENSE
      - run: bash scripts/check-backend.sh
      - run: docker build -t sidewit-api:check backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run check
        working-directory: frontend
      - run: docker build -t sidewit-web:check frontend
