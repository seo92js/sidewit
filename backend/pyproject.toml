[project]
name = "sidewit"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "An AI agent that transforms natural-language queries into executable operations for your applications"
requires-python = ">=3.12"
dependencies = [
    # Exclude the compromised emSign certificate chain from provider HTTPS trust bundles.
    "certifi>=2026.10.19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlglot>=27",
    "tzdata>=2024.1",
    "openai>=1.60",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp>=2.3,<3",
]

[project.scripts]
sidewit-eval = "sidewit.eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    # Only for the parity tests that compare the validator with a real PostgreSQL.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sidewit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
