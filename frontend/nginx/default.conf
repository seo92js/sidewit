server {
    listen 80;
    root /usr/share/nginx/html;
    # URLs/query strings can contain private data; the API emits content-free request logs.
    access_log off;

    # Locations with their own add_header must include this again.
    include /etc/nginx/snippets/sidewit-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    location /api/ {
        include /etc/nginx/snippets/sidewit-proxy.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /mcp {
        include /etc/nginx/snippets/sidewit-mcp.conf;
        proxy_pass http://api:8000;
    }

    location = /mcp/ {
        include /etc/nginx/snippets/sidewit-mcp.conf;
        proxy_pass http://api:8000/mcp;
    }

    # Content-hashed; a missing chunk must 404, not fall back to index.html.
    location /assets/ {
        include /etc/nginx/snippets/sidewit-security-headers.conf;
        # No `always`: a 404 must not be cached.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/sidewit-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
