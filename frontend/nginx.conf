server {
    listen 80;
    root /usr/share/nginx/html;
    # URLs/query strings can contain private data; the API emits content-free request logs.
    access_log off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        proxy_read_timeout 100s;
        client_max_body_size 1m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /mcp {
        proxy_http_version 1.1;
        proxy_read_timeout 100s;
        proxy_buffering off;
        client_max_body_size 1m;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /mcp/ {
        proxy_http_version 1.1;
        proxy_read_timeout 100s;
        proxy_buffering off;
        client_max_body_size 1m;
        proxy_pass http://api:8000/mcp;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
